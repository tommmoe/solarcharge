force_update:
  fields:
    entry_id:
      selector:
        text:
      required: false
      example: "01J..."

apply_now:
  fields:
    entry_id:
      selector:
        text:
      required: false
      example: "01J..."

stop_charging:
  fields:
    entry_id:
      selector:
        text:
      required: false
      example: "01J..."

set_mode:
  fields:
    entry_id:
      selector:
        text:
      required: false
      example: "01J..."
    mode:
      required: true
      selector:
        select:
          options:
            - "off"
            - "free_hours_only"
            - "solar_only"
            - "free_hours_or_solar"
            - "force_charge"
            - "manual"

snooze:
  target:
    entity:
      integration: solar_charge
      domain: select
  fields:
    minutes:
      required: false
      default: 5
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min

cancel_snooze:
  target:
    entity:
      integration: solar_charge
      domain: select
